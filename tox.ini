[tox]
env_list = py311, py312, py313, py314
minversion = 4.23.2

[testenv]
description = run the tests with pytest
package = wheel
wheel_build_env = .pkg
deps =
    .[dev]
commands =
    pytest {tty:--color=yes} {posargs}

[testenv:lint]
description = install black in a virtual environment and invoke it on the current folder
deps = ruff
skip_install = true
commands = ruff check .

[testenv:venv]
envdir = {toxinidir}/.venv
description = create venv for development
deps =
commands =
    pip install -e .[dev]

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
